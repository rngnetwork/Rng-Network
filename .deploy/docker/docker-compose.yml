version: '3.8'

# ==============================================================================
# RNG Full-Stack Containerized Orchestration (PostgreSQL + Backend + Frontend)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rng_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-rng_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-rng_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rng_network

  # ----------------------------------------------------------------------------
  # 2. Spring Boot 3.2.4 Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rng_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-rng_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-rngSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHmacSha256!}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-placeholder}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-discord-client-id-placeholder}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-discord-client-secret-placeholder}
      FRONTEND_2FA_URL: ${FRONTEND_2FA_URL:-http://localhost:3000/auth/2fa}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/error || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rng_network

  # ----------------------------------------------------------------------------
  # 3. Next.js 16 Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rng_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rng_network

# ------------------------------------------------------------------------------
# Persistent Data Volumes & Isolated Virtual Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  rng_network:
    driver: bridge
