name: RNG Control Center CI/CD Pipeline

on:
  [push, pull_request]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Security & Secret Leak Scanning
  # ----------------------------------------------------------------------------
  security-scan:
    name: Security & Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 2: Next.js 16 Frontend CI Pipeline
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend (Next.js 16) CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Install Frontend Dependencies
        id: install
        run: npm ci

      - name: TypeScript Type Check
        id: typecheck
        run: npx tsc --noEmit

      - name: Run Next.js Linter
        id: lint
        run: npm run lint

      - name: Audit Dependencies
        id: audit
        run: npm audit --audit-level=critical || true

      - name: Build Next.js Application
        id: build
        run: npm run build

      - name: Generate Dynamic Frontend Markdown Report
        if: always()
        run: |
          node .github/scripts/generate-frontend-report.js \
            "${{ steps.install.outcome }}" \
            "${{ steps.typecheck.outcome }}" \
            "${{ steps.lint.outcome }}" \
            "${{ steps.audit.outcome }}" \
            "${{ steps.build.outcome }}"

      - name: Output Real-Time Frontend Report to CI Summary
        if: always()
        run: cat target/frontend-report.md >> $GITHUB_STEP_SUMMARY || true

  # ----------------------------------------------------------------------------
  # Job 3: Spring Boot 3.2.4 Backend CI Pipeline
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend (Spring Boot 3.2.4) CI & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js for Validation & Reporting Scripts
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Verify Flyway SQL Schema Mirrored to JPA Entities
        run: node .github/scripts/verify-flyway-jpa-sync.js

      - name: Output Schema Sync Report to CI Summary
        if: always()
        run: cat backend/target/schema-sync-report.md >> $GITHUB_STEP_SUMMARY || true

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x ./backend/mvnw

      - name: Run Backend Tests (Unit, Testcontainers, WireMock) & JaCoCo Verification
        run: ./backend/mvnw -f ./backend/pom.xml verify -Dspring.profiles.active=test

      - name: Generate Dynamic Backend Markdown Test Report
        if: always()
        run: node .github/scripts/generate-backend-test-report.js

      - name: Upload JaCoCo Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Publish Test Report (JUnit Annotations)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  # ----------------------------------------------------------------------------
  # Job 4: Full-Stack Playwright End-to-End (E2E) Browser CI Pipeline
  # ----------------------------------------------------------------------------
  e2e-ci:
    name: Full-Stack E2E Browser Testing
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Setup Environment Files for Docker Compose Stack
        run: |
          cp .env.example .env
          cp .env.local.example .env.local

      - name: Spin Up Containerized Stack (PostgreSQL + Backend + Frontend)
        run: docker compose --project-directory . -f .deploy/docker-compose.yml up -d --build

      - name: Wait for Services Health Check
        run: |
          echo "Waiting for Spring Boot backend and Next.js frontend to become ready..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/v1/auth/forgot-password/initiate > /dev/null 2>&1 && curl -s http://localhost:3000 > /dev/null 2>&1; do sleep 2; done' || true

      - name: Run Playwright E2E Browser Test Suite
        id: playwright
        run: npm run test:e2e

      - name: Generate Dynamic E2E Markdown Summary Report
        if: always()
        run: node .github/scripts/generate-e2e-report.js

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Teardown Docker Compose Stack
        if: always()
        run: docker compose --project-directory . -f .deploy/docker-compose.yml down -v
