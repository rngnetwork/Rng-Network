spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/rng_test_db}
      auto-index-creation: false

jwt:
  secret: testSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHmacSha256!

app:
  frontend:
    2fa-redirect-url: http://localhost:3000/auth/2fa
  discord:
    bot-token: test-bot-token
