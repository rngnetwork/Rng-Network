spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: testSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHmacSha256!

app:
  frontend:
    2fa-redirect-url: http://localhost:3000/auth/2fa
  discord:
    bot-token: test-bot-token
