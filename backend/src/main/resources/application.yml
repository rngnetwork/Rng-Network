server:
  port: ${PORT:8080}
  forward-headers-strategy: framework


spring:
  application:
    name: rng-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rng_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - filesystem:src/main/resources/db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          discord:
            client-id: ${DISCORD_CLIENT_ID:discord-client-id-placeholder}
            client-secret: ${DISCORD_CLIENT_SECRET:discord-client-secret-placeholder}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - identify
              - email
        provider:
          discord:
            authorization-uri: https://discord.com/api/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET:rngSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHmacSha256!}

app:
  frontend:
    2fa-redirect-url: ${FRONTEND_2FA_URL:http://localhost:3000/auth/2fa}
  discord:
    redirect-uri: ${DISCORD_REDIRECT_URI:${NEXT_PUBLIC_DISCORD_REDIRECT_URI:http://localhost:3000/auth/discord/callback}}
    bot-token: ${DISCORD_BOT_TOKEN:}
